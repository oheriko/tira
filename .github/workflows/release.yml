name: Release
on:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      - name: Build binaries
        run: |
          # Linux
          GOOS=linux GOARCH=amd64 go build -o tira-x86_64-linux
          GOOS=linux GOARCH=arm64 go build -o tira-aarch64-linux
          GOOS=linux GOARCH=386 go build -o tira-i686-linux

          # macOS
          GOOS=darwin GOARCH=amd64 go build -o tira-x86_64-darwin
          GOOS=darwin GOARCH=arm64 go build -o tira-aarch64-darwin

          # Windows (might as well)
          GOOS=windows GOARCH=amd64 go build -o tira-x86_64-windows.exe
          GOOS=windows GOARCH=arm64 go build -o tira-aarch64-windows.exe
      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: tira-*
